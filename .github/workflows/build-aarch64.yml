name: build-aarch64

on:
  push:
    branches: ['master']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git meson ninja-build cmake pkg-config \
            libwayland-dev wayland-protocols libdrm-dev libvulkan-dev \
            libsdl2-dev libdecor-0-dev \
            libx11-dev libx11-xcb-dev libxcomposite-dev libxcursor-dev \
            libxkbcommon-dev libxi-dev libxres-dev libxtst-dev libxmu-dev \
            libxxf86vm-dev libxrandr-dev libxrender-dev libxext-dev \
            libxfixes-dev libxdamage-dev \
            libxcb1-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libxcb-render-util0-dev libxcb-xfixes0-dev libxcb-xinput-dev \
            libxcb-xkb-dev libxcb-composite0-dev libxcb-res0-dev \
            libxcb-cursor-dev libxcb-shape0-dev libxcb-render0-dev \
            libcap-dev libpipewire-0.3-dev libglm-dev libstb-dev \
            libluajit-5.1-dev libinput-dev libseat-dev libudev-dev \
            libpixman-1-dev glslang-tools hwdata xwayland libavif-dev libpciaccess-dev

      - name: Install newer Vulkan-Headers (noble ships 1.3.275, WSI layer needs >= 1.4.335)
        run: |
          git clone --depth 1 -b v1.4.335 https://github.com/KhronosGroup/Vulkan-Headers /tmp/vulkan-headers
          cmake -S /tmp/vulkan-headers -B /tmp/vulkan-headers/build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install /tmp/vulkan-headers/build

      - name: Install newer wayland (noble ships 1.22, wlroots 0.20 needs >= 1.24)
        run: |
          git clone --depth 1 -b 1.24.0 https://gitlab.freedesktop.org/wayland/wayland /tmp/wayland
          cd /tmp/wayland
          meson setup build -Ddocumentation=false -Dtests=false -Ddtd_validation=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Install newer libdrm (noble ships 2.4.125, wlroots 0.20 needs >= 2.4.129)
        run: |
          git clone --depth 1 https://gitlab.freedesktop.org/mesa/drm /tmp/libdrm
          cd /tmp/libdrm
          meson setup build
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Install newer libxkbcommon (noble ships 1.6, wlroots 0.20 needs >= 1.8)
        run: |
          git clone --depth 1 -b xkbcommon-1.8.1 https://github.com/xkbcommon/libxkbcommon /tmp/xkb
          cd /tmp/xkb
          meson setup build -Denable-x11=true -Denable-tools=false -Denable-docs=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Install newer libinput (noble ships 1.25, wlroots 0.20 needs >= 1.26)
        run: |
          git clone --depth 1 -b 1.32.0 https://gitlab.freedesktop.org/libinput/libinput /tmp/libinput
          cd /tmp/libinput
          meson setup build -Ddocumentation=false -Dtests=false -Ddebug-gui=false -Dlibwacom=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Install newer pixman (noble ships 0.42.2, wlroots 0.20 needs >= 0.43.0)
        run: |
          git clone --depth 1 -b pixman-0.46.4 https://gitlab.freedesktop.org/pixman/pixman /tmp/pixman
          cd /tmp/pixman
          meson setup build -Dtests=disabled -Ddemos=disabled -Dlibpng=disabled -Dgtk=disabled
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Install newer wayland-protocols (noble ships 1.45, wlroots 0.20 needs >= 1.47)
        run: |
          git clone --depth 1 -b 1.49 https://gitlab.freedesktop.org/wayland/wayland-protocols /tmp/wlproto
          cd /tmp/wlproto
          meson setup build -Dtests=false
          ninja -C build
          sudo ninja -C build install

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          meson setup build \
            -Dbuildtype=release \
            -Denable_openvr_support=false \
            -Denable_tests=false \
            -Dbenchmark=disabled \
            -Dpipewire=enabled

      - name: Build
        run: ninja -C build

      - name: Package
        run: |
          set -e
          ls -la build/src/
          tar -C build/src -czf anland-gamescope-aarch64.tar.gz gamescope

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anland-gamescope-aarch64
          path: anland-gamescope-aarch64.tar.gz
