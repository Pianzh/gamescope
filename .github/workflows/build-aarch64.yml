name: build-aarch64

on:
  push:
    branches: ['master']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git meson ninja-build cmake pkg-config \
            libwayland-dev wayland-protocols libdrm-dev libvulkan-dev \
            libsdl2-dev libdecor-0-dev \
            libx11-dev libx11-xcb-dev libxcomposite-dev libxcursor-dev \
            libxkbcommon-dev libxi-dev libxres-dev libxtst-dev libxmu-dev \
            libxxf86vm-dev libxrandr-dev libxrender-dev libxext-dev \
            libxfixes-dev libxdamage-dev \
            libxcb1-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libxcb-render-util0-dev libxcb-xfixes0-dev libxcb-xinput-dev \
            libxcb-xkb-dev libxcb-composite0-dev libxcb-res0-dev \
            libxcb-cursor-dev libxcb-shape0-dev libxcb-render0-dev \
            libcap-dev libpipewire-0.3-dev libglm-dev libstb-dev \
            libluajit-5.1-dev libinput-dev libseat-dev libudev-dev \
            libpixman-1-dev glslang-tools hwdata xwayland libavif-dev

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          meson setup build \
            -Dbuildtype=release \
            -Denable_openvr_support=false \
            -Denable_tests=false \
            -Dbenchmark=disabled \
            -Dpipewire=enabled

      - name: Build
        run: ninja -C build

      - name: Package
        run: |
          set -e
          ls -la build/src/
          tar -C build/src -czf anland-gamescope-aarch64.tar.gz gamescope

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anland-gamescope-aarch64
          path: anland-gamescope-aarch64.tar.gz
